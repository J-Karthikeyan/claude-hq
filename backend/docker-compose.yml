# Claude HQ Arena on any VM with Docker.
#
#   1. point your domain's A record at the VM's IP
#   2. cp .env.example .env   and fill it in
#   3. ARENA_DOMAIN=arena.yourdomain.com docker compose up -d
#
# Caddy obtains and renews the TLS certificate automatically, so there is no
# certbot cron to forget about.

services:
  # The Arena (Rust). ops/release.sh stamps a version: it sets ARENA_APP_IMAGE
  # and ARENA_VERSION in .release.env. A plain `docker compose up -d --build`
  # builds and runs claude-hq-arena:local.
  app:
    image: ${ARENA_APP_IMAGE:-claude-hq-arena:local}
    build:
      context: .
      args:
        ARENA_VERSION: ${ARENA_VERSION:-dev}
    restart: unless-stopped
    env_file: .env
    environment:
      # The volume, not the image: the database must survive a redeploy.
      ARENA_DATABASE_URL: sqlite+aiosqlite:////data/arena.db
      ARENA_PUBLIC_BASE_URL: https://${ARENA_DOMAIN:?set ARENA_DOMAIN}
      # Soundboard clips, read from a bind-mounted host dir (git-ignored, and
      # kept out of the image) so they survive a redeploy. Drop files into
      # backend/sounds/ on the host; they appear in GET /v1/sounds immediately.
      ARENA_SOUNDS_DIR: /srv/sounds
    volumes:
      - arena-data:/data
      - ./sounds:/srv/sounds:ro
    # Deliberately NOT published to the host: Caddy is the only way in.
    expose:
      - "8080"
    healthcheck:
      # `arena --health`, baked into the image.
      test: ["CMD", "arena-health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Optional: only started with `--profile panel`, so instances that do not
  # want a deploy panel are unaffected.
  panel:
    profiles: ["panel"]
    build:
      context: ../ops
      dockerfile: Dockerfile.panel
    restart: unless-stopped
    env_file: /etc/arena-panel.env
    environment:
      # Mounted at the SAME path it has on the host, not at /repo. The panel
      # drives `docker compose` through the mounted socket, so every path it
      # passes is resolved by the daemon on the host. Under /repo, compose
      # expanded ./Caddyfile to /repo/backend/Caddyfile, the daemon could not
      # find that, created a directory in its place, and Caddy then failed to
      # start with "not a directory" -- taking every site on the box down.
      ARENA_DIR: ${ARENA_DIR:-/root/claude-hq}
      ARENA_DOMAIN: ${ARENA_DOMAIN:?set ARENA_DOMAIN}
      ARENA_DEPLOY_LOG: ${ARENA_DIR:-/root/claude-hq}/.arena-deploy.log
    volumes:
      # The repo it deploys, and the socket it deploys with. This is root-
      # equivalent access -- but the panel can already execute deploys, so
      # containerising it does not widen what it can do, only where it runs.
      - ${ARENA_DIR:-/root/claude-hq}:${ARENA_DIR:-/root/claude-hq}
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "8090"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      ARENA_DOMAIN: ${ARENA_DOMAIN:?set ARENA_DOMAIN}
      # Set by ops/install-panel.sh. Empty when the panel is not installed,
      # which is fine because the Caddyfile block that uses them is only
      # appended by that installer.
      PANEL_DOMAIN: ${PANEL_DOMAIN:-}
      PANEL_UPSTREAM: ${PANEL_UPSTREAM:-}
    ports:
      - "80:80"     # needed for the ACME HTTP challenge, and redirects to 443
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data      # certificates live here -- keep this volume
      - caddy-config:/config

volumes:
  arena-data:
  caddy-data:
  caddy-config:
