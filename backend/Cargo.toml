[package]
name = "arena"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
serde = { version = "1", features = ["derive"] }
# preserve_order makes serde_json::Map an IndexMap instead of a BTreeMap, so a
# decoded object iterates in INPUT order. Python's pydantic reports validation
# errors in the order the keys appeared; without this our 422 detail[] came out
# alphabetically whenever one object had several bad keys.
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
anyhow = "1.0.104"

# Style lints the game simulations trip on purpose: index loops mirror the
# Python port line for line, and the tuple types are wire shapes.
[lints.clippy]
needless_range_loop = "allow"
type_complexity = "allow"
enum_variant_names = "allow"
