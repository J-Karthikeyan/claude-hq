name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Stdlib only — nothing to install.
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend-rs
      - name: Run Rust tests
        run: cargo test --locked
      - name: Clippy (warnings are errors)
        run: cargo clippy --locked --all-targets -- -D warnings

  dashboard-rs:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: dashboard-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dashboard-rs
      - name: Run Rust HQ tests
        run: cargo test --locked
      - name: Clippy (warnings are errors)
        run: cargo clippy --locked --all-targets -- -D warnings
